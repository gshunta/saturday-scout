services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: saturday_scout
      POSTGRES_USER: saturday_scout
      POSTGRES_PASSWORD: ${SATURDAY_SCOUT_DB_PASSWORD:?Set SATURDAY_SCOUT_DB_PASSWORD}
    ports:
      - "127.0.0.1:${SATURDAY_SCOUT_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saturday_scout -d saturday_scout"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
